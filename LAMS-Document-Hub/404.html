<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAMS PSU Portal</title>
  <script>
    (function () {
      var DOC_HUB_URL = 'https://script.google.com/macros/s/AKfycbzV0dwFv5vwHiqp-Cmka6dalVt-D1BzDOtzD_eeswgQ2ZP0uHD8MBXakUCdhoD_qwch/exec';
      var slug = (window.location.pathname || '').replace(/^\/+|\/+$/g, '').toLowerCase();
      var aliases = ['lams-document-hub'];
      if (aliases.indexOf(slug) !== -1) {
        window.location.replace(DOC_HUB_URL + (window.location.search || '') + (window.location.hash || ''));
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 20px; color: #003c71; }
    p { margin: 0 0 24px; font-size: 14px; color: #475569; }
    .btn {
      display: inline-block;
      background: #003c71;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>ไม่พบหน้าที่ท่านต้องการ</h1>
    <p>กรุณาเข้าใช้งานระบบบริการเอกสารผ่านปุ่มด้านล่าง</p>
    <a class="btn" href="https://lams-psu.github.io/LAMS-Document-Hub/">เข้าสู่ LAMS Document Hub</a>
  </main>
</body>
</html>
