<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAMS PSU Portal</title>
  <script>
    (function () {
      var ROUTES = {
        'lams-document-hub': 'https://script.google.com/a/macros/psu.ac.th/s/AKfycbzV0dwFv5vwHiqp-Cmka6dalVt-D1BzDOtzD_eeswgQ2ZP0uHD8MBXakUCdhoD_qwch/exec',
        'lams-congrats-apps': 'https://script.google.com/a/macros/psu.ac.th/s/AKfycbxQCGHfNh5lvt-AuGD89apaccK1dMZ23TMsG4d5uCZO0sn4eavbk-6HCb6LClvFq8b5XQ/exec'
      };
      var slug = (window.location.pathname || '').replace(/^\/+|\/+$/g, '').toLowerCase();
      if (Object.prototype.hasOwnProperty.call(ROUTES, slug)) {
        window.location.replace(ROUTES[slug] + (window.location.search || '') + (window.location.hash || ''));
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 20px; color: #003c71; }
    p { margin: 0 0 24px; font-size: 14px; color: #475569; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: block;
      background: #003c71;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: 10px;
    }
    .btn:hover { background: #002b52; }
  </style>
</head>
<body>
  <main class="card">
    <h1>ไม่พบหน้าที่ท่านต้องการ</h1>
    <p>กรุณาเลือกระบบออนไลน์ของคณะศิลปศาสตร์และวิทยาการจัดการด้านล่าง</p>
    <div class="actions">
      <a class="btn" href="https://lams-psu.github.io/LAMS-Document-Hub/">เข้าสู่ LAMS Document Hub</a>
      <a class="btn" href="https://lams-psu.github.io/LAMS-Congrats-Apps/">เข้าสู่ LAMS Congrats Apps</a>
    </div>
  </main>
</body>
</html>
